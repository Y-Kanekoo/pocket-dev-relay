services:
  pocket-dev-relay:
    build: .
    ports:
      - "4173:4173"
    volumes:
      # ホスト側のワークスペースをコンテナにマウント
      - "${WORKSPACE_PATH:-.}:/workspace"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-pdr-local}
      - WORKSPACE_ROOT=/workspace
      - PORT=4173
    restart: unless-stopped
