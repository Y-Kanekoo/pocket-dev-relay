name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 UTC 0:00 (JST 9:00)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # node-ptyのビルドに必要なネイティブ依存
      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テストの型チェック
        run: npm run typecheck:tests

      - name: 機能別ユニット・境界テスト
        run: npm run test:unit

      - name: HTTP・WebSocket統合テスト
        run: npm run test:integration

      - name: テスト実行（カバレッジレポート付き）
        run: npx vitest run --coverage

      - name: カバレッジレポートをアップロード
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: ビルド
        run: npm run build

      - name: バンドルサイズレポート
        run: |
          echo "## バンドルサイズレポート" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| ファイル | サイズ |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/server.js dist/cli.js public/app.js; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              size_kb=$(echo "scale=1; $size / 1024" | bc)
              echo "| \`$f\` | ${size_kb} KB |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      # lint/formatにネイティブモジュールは不要なのでスクリプト実行をスキップ
      - name: 依存パッケージをインストール
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npx eslint . --ext .ts,.js --max-warnings=0

      # package-lock.jsonはPrettierチェック対象外
      - name: Prettier（フォーマットチェック）
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "public/*.css" "public/*.html" "docs/*.md" "*.md" "*.json" "!package-lock.json"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      # セキュリティ監査にネイティブモジュールは不要なのでスクリプト実行をスキップ
      - name: 依存パッケージをインストール
        run: npm ci --ignore-scripts

      # 脆弱性検出時にCIを失敗させる
      - name: セキュリティ監査
        continue-on-error: false
        run: npm audit --audit-level=high

      # CRITICAL/HIGHの脆弱性検出時にCIを失敗させる
      - name: Trivyセキュリティスキャン
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
