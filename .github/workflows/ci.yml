name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # node-ptyのビルドに必要なネイティブ依存
      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト実行（カバレッジレポート付き）
        run: npx vitest run --coverage

      - name: カバレッジレポートをアップロード
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: ビルド
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      # node-ptyのビルドに必要なネイティブ依存
      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.js

      - name: Prettier（フォーマットチェック）
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: セキュリティ監査
        run: npm audit --audit-level=high
