name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # node-ptyのビルドに必要なネイティブ依存
      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テストの型チェック
        run: npm run typecheck:tests

      - name: 機能別ユニット・境界テスト
        run: npm run test:unit

      - name: HTTP・WebSocket統合テスト
        run: npm run test:integration

      - name: ビルド
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # node-ptyのビルドに必要なネイティブ依存
      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.js --max-warnings=0

      - name: Prettier（フォーマットチェック）
        run: npx prettier --check "src/**/*.ts" "tests/integration/**/*.ts" "tests/server/websocket-lifecycle.test.ts"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ネイティブビルドツールをインストール
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: 依存パッケージをインストール
        run: npm ci

      - name: npm audit（脆弱性チェック）
        run: npm audit --audit-level=high
