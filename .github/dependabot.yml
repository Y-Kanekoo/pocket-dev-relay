version: 2
updates:
  # npm依存関係の自動更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "[chore]"
    # minor/patchは自動マージ可能、majorは手動レビュー
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actionsの自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"
      - "ci"
    commit-message:
      prefix: "[chore]"
