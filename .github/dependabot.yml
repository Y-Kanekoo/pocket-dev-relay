version: 2
updates:
  # npm依存関係の自動更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "[chore]"
    # minor/patchは自動マージ可能、majorは手動レビュー
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actionsの自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # 通常更新のminor/patchだけをまとめる。security updatesは変更しない。
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - "chore"
      - "ci"
    commit-message:
      prefix: "[chore]"
